[package]
name = "ks_replay_parser"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
s2protocol = { version = "3.5.1", default-features = false, features = ["tracing_off"] }

# Better panic messages in console.
console_error_panic_hook = "0.1"

[patch.crates-io]
include_assets = { path = "../vendor/include_assets" }
