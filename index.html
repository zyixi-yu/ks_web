<!DOCTYPE html>
<!-- saved from url=(0027)https://test-not.pages.dev/ -->
<html lang="zh-CN">

<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>凯瑞甘生存 - 积分助手</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937;
            --text-sub: #6b7280;
            --border: #e5e7eb;
            --warning-bg: #fff7ed;
            /* 新增：警示背景色 */
            --warning-text: #c2410c;
            /* 新增：警示文字色 */
            --warning-border: #fed7aa;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            /* 修复：实现垂直居中 */
            padding: 20px;
            box-sizing: border-box;
            /* 防止padding撑破高度 */
        }

        .container {
            width: 100%;
            max-width: 600px;
        }

        /* 搜索区 */
        .search-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            padding: 24px;
            text-align: center;
            margin-bottom: 20px;
        }

        .search-card h1 {
            font-size: 22px;
            margin: 0 0 8px 0;
            font-weight: 700;
            color: #111827;
        }

        .search-card p {
            margin: 0 0 20px 0;
            color: var(--text-sub);
            font-size: 14px;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button.btn-primary {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 0 24px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        button.btn-primary:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            background-color: #9ca3af;
        }

        /* 结果区 */
        #result-display {
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        /* 核心：指令复制区 */
        .command-card {
            background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
            color: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
        }

        .command-label {
            font-size: 14px;
            font-weight: 600;
            opacity: 0.9;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: block;
            margin-bottom: 10px;
        }

        .code-box {
            background: rgba(0, 0, 0, 0.2);
            padding: 12px;
            border-radius: 6px;
            font-family: 'Consolas', monospace;
            font-size: 15px;
            word-break: break-all;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-copy {
            width: 100%;
            background: white;
            color: var(--primary);
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: transform 0.1s;
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        .btn-copy svg {
            width: 18px;
            height: 18px;
        }

        /* 数据网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .stat-title {
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
        }

        .stat-value.highlight {
            color: var(--success);
        }

        /* 公式微缩 - 优化版 */
        .formula-micro {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border);
            font-size: 12px;
            color: var(--text-sub);
            line-height: 1.5;
        }

        .formula-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            /* 对齐顶部，防止换行时数字跑偏 */
            margin-bottom: 4px;
        }

        .formula-row:last-child {
            margin-bottom: 0;
        }

        .label-group {
            display: flex;
            flex-direction: column;
        }

        .label-sub {
            font-size: 10px;
            opacity: 0.8;
            transform: scale(0.95);
            transform-origin: left top;
        }

        .value-text {
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
        }

        /* 底部信息 - 强化版 */
        .meta-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            /* 稍微加大 */
            font-weight: 500;
            color: var(--warning-text);
            /* 改为深橙色 */
            background: var(--warning-bg);
            /* 改为浅橙色背景 */
            border: 1px solid var(--warning-border);
            /* 增加边框提升质感 */
            padding: 12px 16px;
            border-radius: 8px;
            line-height: 1.4;
        }

        .loader {
            display: none;
            margin: 20px auto;
            width: 30px;
            height: 30px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        #error-message {
            color: #dc2626;
            font-size: 14px;
            text-align: center;
            margin-top: 15px;
            display: none;
            line-height: 1.5;
        }

        @media (max-width: 500px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }

            .meta-info {
                flex-direction: column;
                text-align: center;
                gap: 4px;
            }
        }
    </style>

</head>

<body>

    <div class="container">
        <div class="search-card">
            <h1>凯瑞甘生存 · 积分助手</h1>
            <p>输入玩家句柄 (Handle) 查询积分与指令</p>
            <div class="input-group">
                <input type="text" id="handleInput" placeholder="例: 5-S2-1-10252842" autocomplete="off">
                <button id="queryButton" class="btn-primary">查询</button>
            </div>
            <div class="loader" id="loader"></div>
            <div id="error-message"></div>
        </div>

        <div id="result-display">
            <!-- 1. 领取指令 -->
            <div class="command-card">
                <span class="command-label">游戏内领取指令</span>
                <div class="code-box" id="command-text"></div>
                <button class="btn-copy" id="copyButton">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3">
                        </path>
                    </svg>
                    点击一键复制
                </button>
            </div>

            <!-- 2. 数据详情 -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-title">账号总积分 (存档恢复)</div>
                    <div class="stat-value" id="total-points">-</div>
                    <div class="formula-micro">
                        <div style="margin-top: 4px;">若存档丢失会根据此分<br>进行恢复</div>
                    </div>
                </div>

                <div class="stat-card">
                    <div class="stat-title">总奖励积分</div> <!-- 修改文案 -->
                    <div class="stat-value highlight" id="reward-points">-</div>
                    <div class="formula-micro">
                        <div class="formula-row">
                            <span>录像上传奖励</span>
                            <span class="value-text" id="calc-replays">0</span>
                        </div>

                        <!-- 带注释的行 -->
                        <div class="formula-row">
                            <div class="label-group">
                                <span>离场扣分</span>
                                <span class="label-sub">作为凯瑞甘队伍，9分钟前离场</span> <!-- 增加注释 -->
                            </div>
                            <span class="value-text" id="calc-penalty" style="color:#dc2626;">0</span>
                        </div>

                        <div class="formula-row">
                            <span>额外积分奖励</span> <!-- 修改文案 -->
                            <span class="value-text" id="calc-bonus">0</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 3. 底部状态 (强化版) -->
            <div class="meta-info">
                <svg xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;flex-shrink:0" viewBox="0 0 20 20"
                    fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z"
                        clip-rule="evenodd"></path>
                </svg>
                <span id="update-time">--</span>
            </div>
        </div>
    </div>

    <script>
        const base64map = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_";

        // UI Elements
        const handleInput = document.getElementById('handleInput');
        const queryButton = document.getElementById('queryButton');
        const loader = document.getElementById('loader');
        const resultDisplay = document.getElementById('result-display');
        const errorMessage = document.getElementById('error-message');
        const elTotalPoints = document.getElementById('total-points');
        const elRewardPoints = document.getElementById('reward-points');
        const elCommand = document.getElementById('command-text');
        const elUpdateTime = document.getElementById('update-time');
        const copyBtn = document.getElementById('copyButton');

        // Proxy Configuration
        const proxies = [
            {
                name: 'allorigins',
                buildUrl: (url) => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
                parse: async (res) => {
                    const json = await res.json();
                    return JSON.parse(json.contents);
                }
            },
            {
                name: 'thingproxy',
                buildUrl: (url) => `https://thingproxy.freeboard.io/fetch/${url}`,
                parse: async (res) => await res.json()
            },
            {
                name: 'cors.eu.org',
                buildUrl: (url) => `https://cors.eu.org/${url}`,
                parse: async (res) => await res.json()
            }
        ];

        // Events
        queryButton.addEventListener('click', fetchData);
        handleInput.addEventListener('keyup', (e) => { if (e.key === 'Enter') fetchData(); });

        copyBtn.addEventListener('click', () => {
            if (!elCommand.textContent) return;
            navigator.clipboard.writeText(elCommand.textContent).then(() => {
                const originalContent = copyBtn.innerHTML;
                copyBtn.innerHTML = `复制成功!`;
                copyBtn.style.background = '#d1fae5';
                copyBtn.style.color = '#065f46';
                setTimeout(() => {
                    copyBtn.innerHTML = originalContent;
                    copyBtn.style.background = 'white';
                    copyBtn.style.color = 'var(--primary)';
                }, 2000);
            });
        });

        function fetchData() {
            const val = handleInput.value.trim();
            if (!val) return showErr('请输入玩家句柄');

            setLoading(true);
            tryProxy(0, val);
        }

        function fetchWithTimeout(url, timeout = 10000) {
            return Promise.race([
                fetch(url),
                new Promise((_, reject) =>
                    setTimeout(() => reject(new Error('请求超时')), timeout)
                )
            ]);
        }

        async function tryProxy(idx, handle) {
            if (idx >= proxies.length) {
                return showErr('所有查询线路均失败。<br>请检查句柄是否正确 (如: 5-S2-1-xxxxx)，或稍后再试。');
            }

            const proxy = proxies[idx];
            const targetUrl = `https://credits.replayanalyzer.com/?player_handle=${handle}`;
            const requestUrl = proxy.buildUrl(targetUrl);

            console.log(`尝试线路 ${idx + 1}: ${proxy.name}`);

            try {
                const res = await fetchWithTimeout(requestUrl, 8000);
                if (!res.ok) throw new Error(`HTTP ${res.status}`);

                const data = await proxy.parse(res);

                if (!data || !data.code) {
                    throw new Error('返回数据格式错误或玩家不存在');
                }

                const decoded = decodeCreditCode(data.code);
                renderResult(data, decoded);
                setLoading(false);

            } catch (e) {
                console.warn(`线路 ${proxy.name} 失败:`, e);
                tryProxy(idx + 1, handle);
            }
        }

        function intToGalaxyB64(num) {
            num = BigInt(num);
            if (num === 0n) return base64map[0];
            let chars = [];
            while (num > 0n) {
                chars.push(base64map[Number(num % 64n)]);
                num = num / 64n;
            }
            return chars.reverse().join('');
        }

        function decodeCreditCode(code) {
            try {
                const hashPart = code.split('/')[0];
                const payload = intToGalaxyB64(hashPart);
                const parts = payload.split('_');
                if (parts.length !== 3) throw new Error('Invalid format');
                return {
                    amount: parseInt(parts[1], 10),
                    lucy_credits: parseInt(parts[2], 10)
                };
            } catch (e) {
                console.error("解码失败", e);
                return { amount: 0, lucy_credits: 0 };
            }
        }

        function renderResult(data, decoded) {
            const replays = data.replays || 0;
            const penalty = data.penalty || 0;
            const base = replays * 2 - penalty * 10;
            const bonus = (decoded.lucy_credits || 0) - base;

            const updatedTime = data.updated ? new Date(data.updated * 1000) : new Date();
            const timeStr = updatedTime.toLocaleString('zh-CN', { hour12: false, month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });

            elCommand.textContent = `-lucy ${data.code}`;
            elTotalPoints.textContent = decoded.amount.toLocaleString();
            elRewardPoints.textContent = decoded.lucy_credits.toLocaleString();

            // 更新时间提示 - 增加“注意”前缀
            elUpdateTime.innerHTML = `请注意：数据最后更新于 <strong>${timeStr}</strong> (若刚上传录像请稍后刷新)`;

            document.getElementById('calc-replays').textContent = `${replays}局 × 2 = ${replays * 2}`;
            document.getElementById('calc-penalty').textContent = penalty > 0 ? `-${penalty * 10}` : '无';
            document.getElementById('calc-bonus').textContent = bonus !== 0 ? (bonus > 0 ? `+${bonus}` : bonus) : '0';

            resultDisplay.style.display = 'block';
        }

        function setLoading(isLoading) {
            loader.style.display = isLoading ? 'block' : 'none';
            queryButton.disabled = isLoading;
            if (isLoading) {
                resultDisplay.style.display = 'none';
                errorMessage.style.display = 'none';
                queryButton.textContent = '查询中...';
            } else {
                queryButton.textContent = '查询';
            }
        }

        function showErr(msg) {
            errorMessage.innerHTML = msg;
            errorMessage.style.display = 'block';
            setLoading(false);
        }
    </script>

</body>
